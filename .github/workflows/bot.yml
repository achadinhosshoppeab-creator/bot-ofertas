name: bot-ofertas

on:
  # O cron do GitHub atrasa e pula disparos; por isso cada rodada bem-sucedida dispara a próxima
  # (passo final). O cron fica como rede de segurança para religar a corrente se uma rodada falhar.
  schedule:
    # Dia (8h–22h59 de Brasília = 11–23 e 0–1 UTC): a cada 10 min.
    - cron: "*/10 11-23 * * *"
    - cron: "*/10 0-1 * * *"
    # Madrugada (23h–7h59 de Brasília = 2–10 UTC): a cada 30 min, posts mais espaçados.
    - cron: "*/30 2-10 * * *"
  workflow_dispatch:

concurrency:
  group: bot-ofertas
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Janela de publicação igual ou maior que o intervalo do cron: a rodada seguinte fica
      # na fila do grupo de concorrência e começa assim que esta termina, sem buraco no canal.
      # Banco SQLite persiste entre rodadas pelo cache (chave nova a cada rodada, restaura a mais recente).
      - name: Restaurar banco
        uses: actions/cache/restore@v4
        with:
          path: data/bot.db
          key: bot-db-${{ github.run_id }}
          restore-keys: bot-db-

      - name: Clonar site
        uses: actions/checkout@v4
        with:
          repository: achadinhosshoppeab-creator/achadinhosshoppeab-creator.github.io
          path: site
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}

      # Ritmo conforme a hora de Brasília: dia = janela 20 min, posts a cada 1–5 min;
      # madrugada (23h–8h) = janela 30 min, posts a cada 10–20 min.
      - name: Definir ritmo
        run: |
          hora=$(TZ=America/Sao_Paulo date +%H)
          if [ "$hora" -ge 23 ] || [ "$hora" -lt 8 ]; then
            echo "PUBLISH_WINDOW_MINUTES=30" >> "$GITHUB_ENV"
            echo "PUBLISH_INTERVAL_MIN=10" >> "$GITHUB_ENV"
            echo "PUBLISH_INTERVAL_MAX=20" >> "$GITHUB_ENV"
            echo "ritmo: madrugada"
          else
            echo "PUBLISH_WINDOW_MINUTES=20" >> "$GITHUB_ENV"
            echo "PUBLISH_INTERVAL_MIN=1" >> "$GITHUB_ENV"
            echo "PUBLISH_INTERVAL_MAX=5" >> "$GITHUB_ENV"
            echo "ritmo: dia"
          fi

      - name: Rodar
        env:
          OFFER_SOURCE: shopee
          DRY_RUN: "false"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          BRAND_NAME: Achadinhos
          SITE_DIR: site
          SITE_URL: https://achadinhosshoppeab-creator.github.io
          SITE_MAX_OFFERS: "300"
          SITE_PUSH: "true"
          TTS_ENGINE: "off"
        run: |
          git -C site config user.name "Achadinhos"
          git -C site config user.email "347618407+achadinhosshoppeab-creator@users.noreply.github.com"
          npx tsx src/ci.ts

      - name: Salvar banco
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/bot.db
          key: bot-db-${{ github.run_id }}

      - name: Guardar seed do estado
        if: always()
        run: |
          git config user.name "Achadinhos"
          git config user.email "347618407+achadinhosshoppeab-creator@users.noreply.github.com"
          git add data/seed/state.json
          git diff --cached --quiet || git commit -q -m "Atualiza estado [skip ci]"
          git push -q || true

      - name: Encadear próxima rodada
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
